<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MC Xbox</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">MC Xbox prototype</p>
        <h1>Run the server on your laptop. Play in a browser.</h1>
        <p class="lead">This is the first browser-hosted slice: join, move, sync, and controller input hooks.</p>
      </div>
      <div class="panel">
        <label for="name">Player name</label>
        <input id="name" maxlength="16" placeholder="Player">
        <button id="join">Join World</button>
        <p id="status">Not connected</p>
      </div>
    </section>

    <section class="stage">
      <canvas id="game" width="1152" height="648"></canvas>
      <div class="hud">
        <span>WASD / arrows move</span>
        <span>Gamepad supported</span>
        <span>Backend: localhost:8080</span>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
