<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local File Transfer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-html.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <style>
    .glass { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
    .btn-glow { box-shadow: 0 0 15px rgba(59,130,246,0.5); transition: all 0.3s ease; }
    .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(59,130,246,0.8); }
    .preview-box { max-height: 60vh; overflow: auto; border-radius: 8px; }
    .zoomable { cursor: zoom-in; transition: transform 0.2s; }
    .zoomed { transform: scale(2); cursor: zoom-out; }
    model-viewer { width: 100%; height: 100%; min-height: 300px; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 to-black text-white min-h-screen flex flex-col items-center justify-center p-4">
  <div class="glass p-8 rounded-2xl w-full max-w-2xl shadow-2xl">
    <h1 class="text-3xl font-bold mb-2 text-center bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">Local File Transfer</h1>
    <p class="text-gray-400 text-center mb-6">Secure, fast, localhost-only sharing</p>

    <div id="main-menu" class="grid grid-cols-2 gap-4">
      <button onclick="showModal('send')" class="btn-glow bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl">
        📤 Send Files
      </button>
      <button onclick="showModal('receive')" class="btn-glow bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-6 rounded-xl">
        📥 Receive Files
      </button>
    </div>

    <div id="status-panel" class="hidden mt-6 text-center">
      <p id="status-text" class="text-lg font-semibold mb-2"></p>
      <div id="file-zone" class="hidden mt-4 p-4 border-2 border-dashed border-gray-500 rounded-lg cursor-pointer hover:border-blue-400 transition">
        <p>Drag & drop files here or <span class="text-blue-400 underline">click to upload</span></p>
        <input type="file" id="file-input" class="hidden" multiple onchange="handleFiles(this.files)">
      </div>
    </div>

    <div id="preview-area" class="hidden mt-6 preview-box bg-gray-800 p-4"></div>
  </div>

  <!-- Username Modal -->
  <div id="username-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4">
    <div class="glass p-6 rounded-xl w-full max-w-md">
      <h2 class="text-xl font-bold mb-4" id="modal-title">Enter Username</h2>
      <input type="text" id="username-input" placeholder="e.g., john_laptop" class="w-full p-3 rounded bg-gray-800 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <div class="flex justify-end gap-3 mt-4">
        <button onclick="closeModal()" class="px-4 py-2 rounded bg-gray-700 hover:bg-gray-600">Cancel</button>
        <button onclick="confirmUsername()" class="px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 font-bold">Connect</button>
      </div>
    </div>
  </div>

<script>
  let mode = null, myUser = null, targetUser = null, connected = false;
  let zoomLevel = 1;

  function showModal(m) { mode = m; document.getElementById('modal-title').textContent = mode === 'send' ? 'Sender Username' : 'Receiver Username'; document.getElementById('username-modal').classList.remove('hidden'); }
  function closeModal() { document.getElementById('username-modal').classList.add('hidden'); }

  async function confirmUsername() {
    myUser = document.getElementById('username-input').value.trim().toLowerCase();
    if (!myUser) return alert('Please enter a username');
    closeModal();
    await registerUser();
    if (mode === 'receive') {
      document.getElementById('status-text').textContent = '⏳ Waiting for sender to connect...';
      startPolling();
    } else {
      targetUser = prompt('Enter receiver username:');
      if (!targetUser) return;
      await connect();
    }
  }

  async function registerUser() {
    await fetch(`/api/register?username=${myUser}`, {method:'POST'});
    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('status-panel').classList.remove('hidden');
    document.getElementById('status-text').textContent = mode === 'send' ? '🔗 Connecting...' : '⏳ Waiting...';
  }

  async function connect() {
    const res = await fetch(`/api/connect?sender=${myUser}&receiver=${targetUser}`, {method:'POST'});
    const data = await res.text();
    if (res.ok) {
      connected = true;
      showConnected();
    } else {
      alert(data);
    }
  }

  async function startPolling() {
    const poll = setInterval(async () => {
      const res = await fetch(`/api/status/${myUser}`);
      const status = await res.text();
      if (status === 'connected') {
        clearInterval(poll);
        connected = true;
        targetUser = await fetch(`/api/connections`).then(r=>r.text()); // simplified
        showConnected();
      }
    }, 1500);
  }

  function showConnected() {
    document.getElementById('status-text').innerHTML = '✅ <span class="text-green-400">Device Connected</span>';
    document.getElementById('file-zone').classList.remove('hidden');
    document.getElementById('file-zone').onclick = () => document.getElementById('file-input').click();
  }

  document.getElementById('file-zone').addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
  document.getElementById('file-zone').addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation();
    handleFiles(e.dataTransfer.files);
  });

  async function handleFiles(files) {
    if (!connected) return alert('Not connected yet');
    for (let file of files) {
      const fd = new FormData();
      fd.append('file', file);
      fd.append('target', targetUser);
      await fetch('/api/upload', {method:'POST', body:fd});
    }
    alert('Files sent successfully!');
  }

  // Preview logic (runs after file received/downloaded)
  async function previewFile(filename) {
    const res = await fetch(`/api/download/${targetUser}/${filename}`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const area = document.getElementById('preview-area');
    area.classList.remove('hidden');
    area.innerHTML = '';

    const type = blob.type;
    const ext = filename.split('.').pop().toLowerCase();

    // Video/Audio
    if (type.startsWith('video/') || type.startsWith('audio/')) {
      const tag = type.startsWith('video/') ? document.createElement('video') : document.createElement('audio');
      tag.controls = true; tag.src = url; tag.className = 'w-full';
      area.appendChild(tag);
    }
    // Image
    else if (type.startsWith('image/')) {
      const img = document.createElement('img');
      img.src = url; img.className = 'zoomable mx-auto';
      img.onclick = () => img.classList.toggle('zoomed');
      area.appendChild(img);
    }
    // 3D Model
    else if (['glb','gltf','obj'].includes(ext)) {
      const mv = document.createElement('model-viewer');
      mv.setAttribute('src', url);
      mv.setAttribute('camera-controls', '');
      mv.setAttribute('auto-rotate', '');
      mv.setAttribute('ar', '');
      area.appendChild(mv);
    }
    // Text/Code
    else if (['txt','py','html','js','css','md'].includes(ext) || type.startsWith('text/')) {
      const text = await blob.text();
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.className = `language-${ext || 'text'}`;
      code.textContent = text;
      pre.appendChild(code);
      Prism.highlightElement(code);
      area.appendChild(pre);
    }
    // CSV/XLSX
    else if (['csv','xlsx'].includes(ext)) {
      const buf = await blob.arrayBuffer();
      const wb = XLSX.read(buf);
      const ws = wb.Sheets[wb.SheetNames[0]];
      const html = XLSX.utils.sheet_to_html(ws);
      area.innerHTML = `<div class="overflow-auto">${html}</div>`;
    }
    // DOCX
    else if (ext === 'docx') {
      const arrayBuffer = await blob.arrayBuffer();
      const result = await mammoth.convertToHtml({arrayBuffer});
      area.innerHTML = `<div class="prose prose-invert max-w-none">${result.value}</div>`;
    }
    // PPTX (Fallback to download)
    else if (ext === 'pptx') {
      area.innerHTML = `<p class="text-center">PPTX preview requires server-side conversion. <a href="${url}" download="${filename}" class="text-blue-400 underline">Download to view</a></p>`;
    }

    // Download button for all
    const btn = document.createElement('button');
    btn.textContent = '⬇️ Download File';
    btn.className = 'mt-4 px-4 py-2 bg-green-600 rounded hover:bg-green-700';
    btn.onclick = () => { const a = document.createElement('a'); a.href = url; a.download = filename; a.click(); };
    area.appendChild(btn);
  }

  // Auto-preview received files (simplified polling for demo)
  setInterval(async () => {
    if (!connected || mode === 'send') return;
    try {
      const res = await fetch(`/api/download/${myUser}/`); // In real app, list endpoint needed
      // For simplicity, user triggers preview manually via UI or API
    } catch(e) {}
  }, 2000);
</script>
</body>
</html>
